<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const Marks= () => {
            let sub1 = Number(document.getElementById("english").value);
            let sub2 = Number(document.getElementById("math").value);
            let sub3 = Number(document.getElementById("science").value);

            let total = sub1 + sub2 + sub3;
            document.getElementById("msg").innerHTML = "Total = " + total;

            let percentage = total/3;
            document.getElementById("per").innerHTML = "Percentage = " + percentage + "%";
        }
    </script>
</head>
<body>
    <label>English</label>
    <input type="text" id="english"/><br/><br/>

    <label>Math</label>
    <input type="text" id="math"/><br/><br/>

    <label>Science</label>
    <input type="text" id="science"/><br/><br/>

    <input type="button" value="Submit" onclick="Marks()"/>

    <hr/>
    <h2 id="msg"></h2>
    <h2 id="per"></h2>
</body>
</html>
