<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const Addition = () => {
            let a = Number(document.getElementById("txtnum1").value);
            let b = Number(document.getElementById("txtnum2").value);

            let c = a + b;
            document.getElementById("msg").innerHTML= "Addition = " + c;
        }
    </script>
</head>
<body>
    <label>Number_1</label>
    <input type="text" id="txtnum1"/><br/><br/>

    <label>Number_2</label>
    <input type="text" id="txtnum2"/><br/><br/>

    <input type="button" value="Submit" onclick="Addition()"/>

    <hr/>
    <h1 id="msg"></h1>
</body>
</html>
